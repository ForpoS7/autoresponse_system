worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ─── Rate Limiting Zones ───────────────────────────────────────────────────
    # auth: 5 req/min на IP — защита от брутфорса паролей
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    # api: 60 req/min на IP — стандартный лимит для бизнес-логики
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/m;

    # ─── Логирование ──────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Upstreams (Load Balancer) ────────────────────────────────────────────
    # Алгоритм least_conn: новый запрос уходит серверу с меньшим числом активных соединений.
    # Для горизонтального масштабирования добавь строки "server host:port;" в каждый блок.

    upstream auth_upstream {
        least_conn;
        server auth_service:8082;
        # server auth_service_2:8082;   # второй инстанс — раскомментировать при масштабировании
    }

    upstream aggregate_upstream {
        least_conn;
        # host.docker.internal — специальный DNS Docker Desktop (Windows/Mac),
        # позволяет контейнеру обращаться к сервисам на хост-машине
        server host.docker.internal:8080;
    }

    upstream autoapply_upstream {
        least_conn;
        server host.docker.internal:8081;
    }

    # ─── Server ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Прокидываем реальный IP клиента в бэкенды
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Authorization     $http_authorization;

        # ── Auth Service (/auth/*) ──────────────────────────────────────────
        # POST /auth/register  → auth_service /register
        # POST /auth/login     → auth_service /login
        # POST /auth/validate  → auth_service /validate  (внутренний, для сервисов)
        location /auth/ {
            limit_req zone=auth_zone burst=10 nodelay;
            limit_req_status 429;
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass http://auth_upstream;
        }

        # ── Aggregate Service / Java (:8080) ───────────────────────────────
        location /api/vacancies {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://aggregate_upstream/api/vacancies;
        }

        location /api/hh-token {
            limit_req zone=api_zone burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://aggregate_upstream/api/hh-token;
        }

        location /api/scheduler {
            limit_req zone=api_zone burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://aggregate_upstream/api/scheduler;
        }

        # ── AutoApply Service / Go (:8081) ─────────────────────────────────
        location /api/autoapply {
            limit_req zone=api_zone burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://autoapply_upstream/api/autoapply;
        }

        # ── Archive (cold storage management) ─────────────────────────────
        location /api/archive {
            limit_req zone=api_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://autoapply_upstream/api/archive;
        }

        # ── Gateway health check (без rate limit) ──────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Кастомный ответ при превышении rate limit ──────────────────────
        error_page 429 @rate_limited;
        location @rate_limited {
            add_header Content-Type  application/json always;
            add_header Retry-After   60 always;
            return 429 '{"error":"too many requests","retry_after_seconds":60}';
        }
    }
}
