server:
  port: 8081

database:
  host: localhost
  port: 5444
  name: hh
  user: postgres
  password: postgres
  sslmode: disable

kafka:
  brokers:
    - localhost:9092
  topic:
    vacancies:       vacancies.parsed
    parse_requested: parse.requested
    token_updated:   token.updated
    vacancy_input:   vacancy_input
    vacancy_output:  vacancy_output

jwt:
  secret: defaultSecretKeyForDevelopment11111111111111111111111111111111111111111111111111111111111
  expiration: 86400000 # 24 часа в миллисекундах
  java_service_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ0ZXN0QGV4YW1wbGUuY29tIiwiaWF0IjoxNzczNTg5OTUyLCJleHAiOjE3NzM2NzYzNTJ9.4JmmHoC8hDiE3b4SvvuikxQHegUuMCeuaHgdLkJIimw

playwright:
  headless: false
  area_code: 1 # Москва (можно изменить на другой регион)
  slow_mo: 100

rate_limiter:
  enabled: true
  requests_per_minute: 10
  burst: 5

hh:
  api_url: https://hh.ru

# Scheduler настройки
scheduler:
  parser:
    cron: "" # Пустое значение отключает планировщик

# Redis кеш
redis:
  addr:     "localhost:6379"
  password: ""
  db:       0

# Хранилище данных
storage:
  endpoint:   "localhost:9000"   # MinIO S3 API (cold storage)
  access_key: "minioadmin"
  secret_key:  "minioadmin"
  bucket:      "hh-archive"
  logs_retain_days:      30   # auto_apply_logs живут в PostgreSQL 30 дней, потом → MinIO
  vacs_retain_days:       7   # vacancies живут в PostgreSQL 7 дней, потом → MinIO
  archive_interval_hours: 24  # архивация раз в сутки
