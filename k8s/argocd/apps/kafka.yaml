# Sub-app: Kafka через Strimzi оператор.
# ArgoCD задеплоит Strimzi CRDs и Kafka cluster CR из этого пути.
# Ansible role (k8s/ansible) делает то же самое — выбрать один подход.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: REPO_URL   # ← заменить на git remote get-url origin
    targetRevision: HEAD
    path: k8s/ansible/roles/kafka_strimzi/files
    # Альтернатива — Helm-чарт напрямую:
    # repoURL: https://strimzi.io/charts/
    # chart: strimzi-kafka-operator
    # targetRevision: 0.42.0
    # helm:
    #   values: |
    #     watchAnyNamespace: false
    #     defaultImageRegistry: quay.io
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # нужен для Strimzi CRD (слишком большие для client-side)
