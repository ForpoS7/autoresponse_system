replicaCount: 1

image:
  repository: localhost:30050/auth-service  # CI обновляет tag при каждом push
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8082

# Ссылки на секреты созданные Terraform (k8s/terraform/secrets.tf)
externalSecrets:
  postgres: postgres-credentials   # ключи: DATABASE_URL, POSTGRES_*
  jwt:      jwt-signing-key        # ключ:  JWT_SECRET

config:
  serverPort: "8082"
  logLevel: info

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podAnnotations:
  # OTel Auto-instrumentation (требует OTel Operator)
  instrumentation.opentelemetry.io/inject-go: "true"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8082"
  prometheus.io/path: "/metrics"
