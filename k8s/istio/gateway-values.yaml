# istio-ingressgateway — точка входа внешнего трафика в mesh.
# NodePort для k3d (LoadBalancer недоступен без облачного провайдера).

service:
  type: NodePort
  nodePorts:
    http2: 30080
    https: 30443

autoscaling:
  enabled: false
  minReplicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
